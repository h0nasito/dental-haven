{% extends "kiosk/_base.html" %}
{% block kiosk %}
<div class="card" style="max-width:420px;margin:2rem auto">
<h1>Staff: leave kiosk mode</h1>
<p class="muted">Enter the password of the staff account that started the kiosk.</p>
{% if error %}<p class="notice error-notice" role="alert">{{ error }}</p>{% endif %}
<form method="post">{{ csrf() }}
<div class="field"><label for="kx-pw">Password</label><input id="kx-pw" type="password" name="password" autocomplete="current-password" required></div>
<div class="row" style="gap:.5rem"><button class="btn">Leave kiosk mode</button><a class="btn btn-secondary" href="{{ url_for('kiosk.form') }}">Back to the form</a></div></form></div>
{% endblock %}
