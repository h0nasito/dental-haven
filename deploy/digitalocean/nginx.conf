# Installed by setup.sh as /etc/nginx/sites-available/dental-haven.
# certbot adds the HTTPS (port 443) part and the HTTP-to-HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    # Uploads (X-rays, photos, imports). Matches MAX_REQUEST_MB in the app.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
